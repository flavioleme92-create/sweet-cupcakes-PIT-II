{% extends 'base.html' %}{% block content %}<section class="panel narrow auth-card"><div class="auth-brand"><img src="{{ url_for('static', filename='img/logo-login.jpg') }}" alt="Logotipo Sweet Cupcakes"><h1>Sweet Cupcakes</h1><p>Cupcakes gourmet artesanais do Flávio</p></div><h2>{{ title }}</h2><form method="post">{% if register %}<label>Nome completo<input name="name" minlength="2" required autocomplete="name"></label>{% endif %}<label>E-mail<input name="email" type="email" required autocomplete="email"></label><label>Senha<input name="password" type="password" minlength="8" required autocomplete="{{ 'new-password' if register else 'current-password' }}"></label><button class="primary" type="submit">{{ 'Cadastrar' if register else 'Entrar' }}</button></form><p>{% if register %}Já tem uma conta? <a href="{{ url_for('login') }}">Entre aqui.</a>{% else %}Ainda não tem conta? <a href="{{ url_for('register') }}">Cadastre-se.</a>{% endif %}</p></section>{% endblock %}
